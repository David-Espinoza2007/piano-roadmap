<style>
/* Layout: one music-stand column; bottom bar is the key slip, tabs are keys. */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --ink:#16151A; --muted:#6B6862; --line:#DEDBD2;
  --brass:#8E6A1F; --on-brass:#FFFFFF; --ok:#2F7A4F; --warn:#B5452F; --slip:#16151A; --slip-ink:#EDEAE2;
  --display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0E10; --surface:#18181B; --ink:#EDEAE2; --muted:#9A968C; --line:#2A2A2E;
  --brass:#D2A84C; --on-brass:#16151A; --ok:#6CC08F; --warn:#E07A62; --slip:#050506; --slip-ink:#EDEAE2;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
a{color:var(--brass)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:20px;padding-block:20px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.875rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;min-height:44px}
.btn.primary{background:var(--brass);color:var(--on-brass);border-color:var(--brass);font-weight:700}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.875rem}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;min-height:36px;font-size:.875rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
label.check{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
label.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brass);flex:none}
label.check input:checked + span{color:var(--muted);text-decoration:line-through}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";float:right;color:var(--muted)}
details[open]>summary::after{content:"－"}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.st0{color:var(--muted)} .st1{color:var(--brass)} .st2{color:var(--ok)}
.tablewrap{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.875rem} th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
/* Bottom key slip */
nav.slip{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--slip);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;gap:4px}
nav.slip button{flex:1;min-width:0;border:0;border-radius:0 0 6px 6px;background:#ECE8DD;color:#16151A;padding:10px 2px 8px;font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 -3px 0 #CFC9BA}
nav.slip button svg{width:22px;height:22px}
nav.slip button[aria-current="page"]{background:#FFFFFF;box-shadow:inset 0 -3px 0 #D2A84C}
/* Metronome */
.bpm{font-family:var(--display);font-size:5.5rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0}
.dot[data-a="2"]{border-color:var(--brass)}
.dot[data-a="0"]{border-style:dashed;opacity:.5}
.dot.on{background:var(--ink)} .dot.on[data-a="2"]{background:var(--brass)}
input[type=range]{width:100%;accent-color:var(--brass)}
.play{width:88px;height:88px;border-radius:50%;border:0;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:1rem;align-self:center}
.timer{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:5.5rem repeat(7,1fr);gap:4px;align-items:center;font-size:.8rem}
.grid7 i{display:block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);margin:auto}
.grid7 i.y{background:var(--brass);border-color:var(--brass)}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700}
.answer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ok{color:var(--ok)} .bad{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===================== TEORÍA: escalas y voicings ===================== */
const L='CDEFGAB', LPC=[0,2,4,5,7,9,11], MAJ=[0,2,4,5,7,9,11];
const parse=n=>{const l=L.indexOf(n[0]);let a=0;for(const c of n.slice(1))a+=c==='#'?1:-1;return{l,pc:(LPC[l]+a+12)%12}};
const name=(l,pc)=>{let d=(pc-LPC[l]+12)%12;if(d>6)d-=12;return L[l]+(d>0?'#'.repeat(d):'b'.repeat(-d))};
const degree=(key,d)=>{const r=parse(key);return name((r.l+d)%7,(r.pc+MAJ[d])%12)};
const fmt=n=>n[0]+n.slice(1).replace(/b/g,'♭').replace(/#/g,'♯');
function twoFiveOne(key){ // shell voicings 1-3-7: [nombre, MI, MD]
  const g=d=>fmt(degree(key,d));
  return [[g(1)+'m7',g(1),g(3)+' + '+g(0)],[g(4)+'7',g(4),g(6)+' + '+g(3)],[fmt(key)+'maj7',fmt(key),g(2)+' + '+g(6)]];
}

 {maj:['C','G','F'],min:[],extra:['en 3ras','en 6tas','escala blues y pentatónica menor','arpegio de dominante 7','arpegio disminuido 7','cromática manos juntas','dórico y mixolidio']},
 {maj:['C','F','Bb','Eb','G','D'],min:[],extra:['bebop dominante','bebop mayor','cromática manos juntas']},

];

let AC,MASTER;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function click(t,lvl){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=lvl===3?1760:lvl===2?1175:880;
  const v=S.metro.vol*(lvl===3?1:lvl===2?.65:.32);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g).connect(MASTER);o.start(t);o.stop(t+.06);
}
function tone(midi,t,d=1.2){
  const f=440*2**((midi-69)/12);
  [[1,'triangle',.5],[2,'sine',.15],[3,'sine',.06]].forEach(([h,type,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f*h;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(MASTER);o.start(t);o.stop(t+d+.05);
  });
}
const beep=()=>{audio();tone(84,AC.currentTime,.4);tone(88,AC.currentTime+.2,.6);navigator.vibrate?.([200,100,200])};

function weekDays(){const d=new Date();const dow=(d.getDay()+6)%7;return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()-dow+i);return today(x)})}
function total(k){const l=S.log[k];return l?LOGCATS.reduce((s,[c])=>s+(l[c]||0),0):0}
function streak(){let n=0;const d=new Date();if(!total(today(d)))d.setDate(d.getDate()-1);while(total(today(d))){n++;d.setDate(d.getDate()-1)}return n}
function logMin(cat,m){const k=today();S.log[k]=S.log[k]||{};S.log[k][cat]=Math.max(0,(S.log[k][cat]||0)+m);save()}
function sessionFor(p){return SESSIONS[p<2?0:p<4?1:2]}
function blockDetail(name,p){
  const di=dayIdx(), sc=SCALES[p];
  if(name==='Calentamiento')return 'Escalas lentas, dedos sueltos. Hombros abajo.';
  if(name==='Técnica'){
    const n=sc.maj.length, m=[sc.maj[(di*2)%n],sc.maj[(di*2+1)%n]];
    let s='Escalas: '+m.map(fmt).join(', ');
    if(sc.min.length)s+=', '+fmt(sc.min[di%sc.min.length])+' armónica';
    s+=` (2 oct., ♩=${BPM_TEC[p]}) + arpegios.`;
    if(sc.extra)s+=' Variante: '+sc.extra[di%sc.extra.length]+'.';
    const [a,b]=HANON[p];s+=' Hanon #'+(a+di%(b-a+1))+'.';
    if(p>=2){const k=[0,1,2].map(i=>FOURTHS[(di*3+i)%12]);s+=' ii-V-I '+(p>=3?'rootless':'shell')+' en '+k.map(fmt).join(', ')+'.'}
    return s;
  }
  if(name==='Lectura / 2ª pieza')return '1 página a primera vista (Alfred/Faber nivel 2), sin parar aunque falles. O tu pieza secundaria.';
  if(/Repertorio|Clásico/.test(name)){const w=allPieces().filter(x=>x.cat!=='jazz'&&pst(x.id).st===1);return w.length?'Montando: '+w.slice(0,2).map(x=>x.t).join(' · ')+'. Trabaja lo que NO te sale.':'Elige una pieza en Repertorio y márcala como "Montando".'}
  if(name==='Jazz'){const w=allPieces().filter(x=>x.cat==='jazz'&&pst(x.id).st===1);return (w.length?'Standard: '+w[0].t+'. ':'')+'Lead sheet, voicings e impro con iReal Pro.'}
  return OIDO[p];
}

document.getElementById('v-hoy').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.log){const [c,m]=t.dataset.log.split(',');logMin(c,+m);renderHoy()}
  else if(t.id==='vid'){S.videos.push(today().slice(0,7));save();renderHoy()}
  else if(t.id==='sess-go')startSession(sessionFor(S.phase));
  else if(t.dataset.special){const [m,n,c]=t.dataset.special.split(',');startSession([[+m,n,c]])}
  else if(t.id==='t-pause'){T.run=!T.run;T.last=Date.now();showRun()}
  else if(t.id==='t-next')nextBlock(false);
  else if(t.id==='t-stop'){flushBlock();T=null;releaseWake();renderHoy()}
});
function startSession(blocks){audio();T={blocks,i:0,left:blocks[0][0]*60,run:true,last:Date.now(),used:0};wake();showRun()}
function flushBlock(){if(!T)return;const m=Math.round(T.used/60);if(m)logMin(T.blocks[T.i][2],m);T.used=0}
function nextBlock(finished){flushBlock();if(finished)beep();T.i++;if(T.i>=T.blocks.length){T=null;releaseWake();renderHoy();return}T.left=T.blocks[T.i][0]*60;T.last=Date.now();showRun()}
function showRun(){
  const r=document.getElementById('sess-run');if(!r)return;
  document.getElementById('sess-list').hidden=true;document.getElementById('sess-go').parentElement.hidden=true;r.hidden=false;
  const b=T.blocks[T.i],s=Math.max(0,Math.ceil(T.left));

}
setInterval(()=>{if(!T||!T.run)return;const now=Date.now(),dt=(now-T.last)/1000;T.last=now;T.left-=dt;T.used+=dt;
  if(T.left<=0)nextBlock(true);else{const c=document.getElementById('t-clock');if(c){const s=Math.ceil(T.left);c.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}},250);

let WL=null;
async function wake(){try{WL=await navigator.wakeLock?.request('screen')}catch{}}

/* ===================== METRÓNOMO ===================== */
const METERS={'2/4':[2,1],'3/4':[2,1,1],'4/4':[2,1,1,1],'5/4':[2,1,1,1,1],'6/8':[2,1,1,2,1,1],'7/8':[2,1,2,1,2,1,1],'9/8':[2,1,1,2,1,1,2,1,1],'12/8':[2,1,1,2,1,1,2,1,1,2,1,1]};
const SUBS=[[1,'♩','Negras'],[2,'♪♪','Corcheas'],[3,'3','Tresillos'],[4,'♬♬','Semicorcheas'],['sw','swing','Corcheas con swing']];
const TEMPO=b=>b<60?'Largo':b<66?'Larghetto':b<76?'Adagio':b<108?'Andante':b<120?'Moderato':b<168?'Allegro':b<200?'Presto':'Prestissimo';
const M={on:false,beat:0,bar:0,next:0,q:[],tid:0,taps:[]};
const accents=()=>{const m=S.metro;if(!m.acc||m.acc.length!==METERS[m.meter].length)m.acc=METERS[m.meter].slice();return m.acc};
const eighth=()=>S.metro.meter.endsWith('/8');
function offsets(){const m=S.metro;if(eighth()||m.twofour)return[0];if(m.swing)return[0,2/3];return [...Array(m.sub)].map((_,i)=>i/m.sub)}
function schedule(){
  const m=S.metro,acc=accents();
  while(M.next<AC.currentTime+.12){
    const spb=60/m.bpm,b=M.beat;
    let a=acc[b]; if(m.twofour&&m.meter==='4/4')a=(b%2)?1:0;
    offsets().forEach((f,i)=>{const lvl=i===0?(a===2?3:a===1?2:0):(a?1:0);if(lvl)click(M.next+f*spb,lvl)});
    M.q.push([M.next,b]);M.next+=spb;M.beat++;
    if(M.beat>=acc.length){M.beat=0;M.bar++;
      if(m.tr.on&&M.bar%m.tr.bars===0&&m.bpm<m.tr.max){m.bpm=Math.min(m.tr.max,m.bpm+m.tr.step);save();setTimeout(syncBpm,0)}}
  }
}
function draw(){if(!M.on)return;while(M.q.length&&M.q[0][0]<=AC.currentTime){const [,b]=M.q.shift();document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===b))}requestAnimationFrame(draw)}
function startMetro(){audio();M.on=true;M.beat=0;M.bar=0;M.q=[];M.next=AC.currentTime+.06;schedule();M.tid=setInterval(schedule,25);requestAnimationFrame(draw);wake();syncPlay()}
function stopMetro(){M.on=false;clearInterval(M.tid);document.querySelectorAll('.dot').forEach(d=>d.classList.remove('on'));releaseWake();syncPlay()}
function setBpm(v){S.metro.bpm=Math.max(20,Math.min(300,Math.round(v)));save();syncBpm()}
function syncBpm(){const b=document.getElementById('m-bpm');if(!b)return;b.textContent=S.metro.bpm;document.getElementById('m-range').value=S.metro.bpm;document.getElementById('m-name').textContent=TEMPO(S.metro.bpm)+' · '+(eighth()?'♪':'♩')+' = '+S.metro.bpm}
function syncPlay(){const p=document.getElementById('m-play');if(p)p.textContent=M.on?'Parar':'Tocar'}
function renderMetro(){
  const m=S.metro,acc=accents();
  document.getElementById('v-metro').innerHTML=`
  <header><div class="eyebrow">Metrónomo</div><h1>Lento es rápido</h1></header>
  <div class="card" style="gap:16px">
    <div class="bpm" id="m-bpm" aria-live="polite">${m.bpm}</div>
    <div class="small muted" style="text-align:center" id="m-name"></div>
    <input type="range" id="m-range" min="20" max="300" value="${m.bpm}" aria-label="Tempo">

const vm=document.getElementById('v-metro');
vm.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const m=S.metro;
  if(t.id==='m-play')M.on?stopMetro():startMetro();
  else if(t.dataset.d)setBpm(m.bpm+ +t.dataset.d);
  else if(t.dataset.i!==undefined){const a=accents(),i=+t.dataset.i;a[i]=(a[i]+2)%3;t.dataset.a=a[i];save()}
  else if(t.dataset.meter){m.meter=t.dataset.meter;m.acc=null;save();const on=M.on;if(on)stopMetro();renderMetro();if(on)startMetro()}
  else if(t.dataset.sub){const v=t.dataset.sub;if(v==='sw')m.swing=true;else{m.swing=false;m.sub=+v}save();renderMetro()}
  else if(t.id==='m-tap'){const n=performance.now();M.taps=M.taps.filter(x=>n-x<2000);M.taps.push(n);if(M.taps.length>1){const iv=(M.taps.at(-1)-M.taps[0])/(M.taps.length-1);setBpm(60000/iv)}if(M.taps.length>5)M.taps.shift()}
});
vm.addEventListener('input',e=>{const m=S.metro,t=e.target;
  if(t.id==='m-range')setBpm(+t.value);
  else if(t.id==='m-vol'){m.vol=+t.value;save()}
  else if(t.id==='m-24'){m.twofour=t.checked;save()}
  else if(t.id==='tr-on'){m.tr.on=t.checked;save()}
  else if(t.id.startsWith('tr-')&&+t.value>0){m.tr[t.id.slice(3)]=+t.value;save()}
});

function renderRoad(){
  document.getElementById('v-road').innerHTML=`<header><div class="eyebrow">36 meses · el orden importa más que el calendario</div><h1>Roadmap</h1></header>
  <p class="small muted" style="margin:0">Dominar = tocar la pieza completa, fluida, con dinámica y a tempo, 3 veces seguidas sin error grave. Nunca pases de nivel sin dominar el anterior.</p>`+
  PHASES.map((ph,p)=>{
    const items=ph.areas.flatMap((a,ai)=>a[1].map((_,ii)=>phaseKey(p,ai,ii))),cks=ph.check.map((_,i)=>phaseKey(p,'c',i));
    const d=items.concat(cks).filter(k=>S.checks[k]).length,n=items.length+cks.length,allCk=cks.every(k=>S.checks[k]);
    return `<details class="card" ${p===S.phase?'open':''}><summary><div class="eyebrow">Fase ${p} · ${ph.months}${p===S.phase?' · <span style="color:var(--brass)">estás aquí</span>':p<S.phase?' · completada':''}</div><h2>${esc(ph.name)}</h2><div class="small muted num">${d}/${n}</div></summary>
    <div class="bar"><i style="width:${Math.round(d/n*100)}%"></i></div>
    <p style="margin:0">${esc(ph.goal)}</p>
    ${ph.areas.map((a,ai)=>`<div><h3>${esc(a[0])}</h3><ul class="plain">${a[1].map((it,ii)=>{const k=phaseKey(p,ai,ii);return `<li><label class="check"><input type="checkbox" data-k="${k}" ${S.checks[k]?'checked':''}><span>${esc(it)}</span></label></li>`}).join('')}</ul></div>`).join('')}
    <div style="border-top:1px solid var(--line);padding-top:12px"><h3>Checkpoint F${p}</h3><ul class="plain">${ph.check.map((it,i)=>{const k=phaseKey(p,'c',i);return `<li><label class="check"><input type="checkbox" data-k="${k}" ${S.checks[k]?'checked':''}><span>${esc(it)}</span></label></li>`}).join('')}</ul></div>
    ${p===S.phase&&p<4?`<button class="btn ${allCk?'primary':''}" data-adv ${allCk?'':'disabled'}>${allCk?'Pasar a la Fase '+(p+1):'Cumple el checkpoint para avanzar'}</button>`:''}
    </details>`}).join('')+`<div class="card"><h3>Después del roadmap</h3><p style="margin:0">Bebop avanzado (Giant Steps, Confirmation), composición propia y el clásico que quieras. A partir de aquí el camino es escuchar, transcribir y tocar con gente, en loop.</p></div>`;
}

const vg=document.getElementById('v-guia');
vg.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.id==='ear-play'){earPlay();t.textContent='Repetir'}
  else if(t.id==='ear-new')earNew();
  else if(t.dataset.int&&EAR.q){const ok=+t.dataset.int===EAR.q.i;EAR.n++;if(ok)EAR.ok++;
    const m=document.getElementById('ear-msg');m.className='small '+(ok?'ok':'bad');m.textContent=ok?'¡Bien! '+INTS[EAR.q.i-1]:'Era '+INTS[EAR.q.i-1];
    document.getElementById('ear-score').textContent=EAR.ok+'/'+EAR.n;if(ok)setTimeout(earNew,900)}
  else if(t.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='piano-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
});
vg.addEventListener('change',e=>{const t=e.target;
  if(t.id==='v-key')showVoicing(t.value);
  else if(t.id==='setph'){S.phase=+t.value;save()}
  else if(t.id==='imp'&&t.files[0]){t.files[0].text().then(txt=>{const d=JSON.parse(txt);if(typeof d.phase!=='number'||!d.log)throw 0;S=Object.assign(defaults(),d);save();document.getElementById('bk-msg').textContent='Respaldo restaurado.';renderGuia()}).catch(()=>{document.getElementById('bk-msg').textContent='Ese archivo no es un respaldo de esta app.'})}
});

/* ===================== ARRANQUE ===================== */
renderHoy();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
